[config]
skip_core_tasks = true

[tasks.watch]
command = "cargo"
args = ["watch", "-x", "check", "-s", "cargo make test"]


[tasks.test-native]
command = "cargo"
args = [ "test" ]

[tasks.test-browser-matrix]
script = [
	"bash scripts/test-browser.sh firefox debug",
	"bash scripts/test-browser.sh firefox release",
	"bash scripts/test-browser.sh chrome debug",
	"bash scripts/test-browser.sh chrome release",
]


[tasks.test]
run_task = { name = [
	"test-native",
	"test-browser-matrix",
] }


[tasks.doc]
command = "cargo"
args = ["doc", "--open", "--target=wasm32-unknown-unknown"]
