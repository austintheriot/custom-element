[package]
name = "custom-element"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
keywords = ["web-components", "custom-elements", "html", "web-assembly"]
categories = ["web-programming", "wasm", "gui"]
description = "A CustomElement trait for implementing custom elements (web components) in Rust"
repository = "https://github.com/austintheriot/custom-element"
readme = "README.md"
exclude = ["docs/", "scripts/", ".github/", ".cargo-husky/"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
web-sys = { version = "0.3.106", features = [
	"Window",
	"Event",
	"Document",
	"HtmlElement",
] }
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"

[dev-dependencies]
wasm-bindgen-test = "0.3.79"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = [
	"CustomElementRegistry",
	"ElementDefinitionOptions",
	"DomImplementation",
	"HtmlParagraphElement",
	"ElementCreationOptions",
	"EventInit",
	"EventTarget",
	"ShadowRoot",
	"ShadowRootInit",
	"ShadowRootMode",
] }


[dev-dependencies.cargo-husky]
version = "1"
default-features = false
features = ["user-hooks"]
